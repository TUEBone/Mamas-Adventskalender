<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><title>Christels Adventskalender</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#fff4e2;font:16px/1.55 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:18px}header,nav,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}header{border-bottom:1px solid #ffffff38;padding-bottom:12px}small,label{font-size:.8rem;letter-spacing:.07em}select,button{font:inherit;color:inherit;background:#22343d;border:1px solid #ffffff45;border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid gold}button:hover:enabled{border-color:#ffdc8d}h1,h2{font:normal clamp(2rem,6vw,3.6rem)/1.04 Georgia;margin:12px 0}h2{font-size:1.8rem}p{max-width:65ch}canvas{display:block;width:100%;border-radius:14px;margin:16px 0;background:#18273a}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.grid button{padding:8px 1px;min-height:44px;font-family:Georgia;font-size:1.22rem}.active{background:#ffdf9c;color:#25202a}article{padding:17px 0}#actions{display:flex;gap:8px;flex-wrap:wrap}#scene{position:relative}#scene button{position:absolute;transform:translate(-50%,-50%);background:transparent;border:0;font-size:clamp(19px,4vw,32px);padding:0;min-width:44px;min-height:44px}.hint{outline:3px dashed gold}footer{margin:24px 0;color:#c7c8bd}input{width:20px;height:20px;vertical-align:middle}@media(max-width:550px){.grid{grid-template-columns:repeat(6,1fr)}main{padding:12px}select{max-width:100%}}

#frame{overflow:hidden;border-radius:14px;margin:1rem 0;isolation:isolate}
#stage{position:relative}
#art{margin:0}
body:not(.inside) #art{height:clamp(320px,56vw,450px);object-fit:cover}
#days{position:absolute;inset:12% 5% 7%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(5px,1vw,12px)}
#days button{position:relative;background:radial-gradient(ellipse,#fff2ba,#e7aa56 55%,#684127);padding:0;overflow:visible;border:1px solid #d9ad74;border-radius:4px;box-shadow:0 2px 6px #10131d99;perspective:480px;color:#fff5de;opacity:1}
#days .leaf{display:grid;place-items:center;position:absolute;inset:0;background:linear-gradient(130deg,#263e4bf2,#192732f2);border:2px ridge #d6b884;border-radius:3px;transform-origin:left center;backface-visibility:hidden;font:bold clamp(17px,3.7vw,30px) Georgia}
#days button:disabled .leaf{color:#e0d7c6;background:linear-gradient(130deg,#364650ee,#26343cee)}
#days .active .leaf{background:linear-gradient(120deg,#913f30,#653427);border-color:#ffe4a6}
#days .leaf:after{content:'';position:absolute;right:8%;top:53%;width:4px;height:4px;border-radius:50%;background:#eac788}
.inside #days,.inside #intro,.inside .row,body:not(.inside) #back{display:none}
.inside #panel{animation:appear .35s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:510px){#days{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);inset:8% 5% 5%}body:not(.inside) #art{height:370px}}
@media(prefers-reduced-motion:reduce){.inside #panel{animation:none}}

body:not(.inside){overflow:hidden}
body:not(.inside) main,body:not(.inside) article{margin:0;padding:0;max-width:none}
body:not(.inside) header,body:not(.inside) article>:not(#frame),body:not(.inside) .row,body:not(.inside) footer,.inside #frame,.inside header{display:none}
#frame{position:fixed;inset:0;width:100%;height:100dvh;margin:0;border-radius:0;background:#1a2234}
#stage{position:absolute;top:50%;left:50%;translate:-50% -50%;width:min(100vw,59.9753dvh);aspect-ratio:971/1619;background:center/100% 100% url(bethlehem.svg)}
@media (orientation:portrait) and (max-width:700px){#stage{width:max(100vw,59.9753dvh)}}
#art,#scene{display:none}
#days{display:block;inset:0}
#days button,#days button:disabled{position:absolute;transform:translate(-50%,-50%);width:11.33%;height:4.2%;min-height:0;border:0;background:none;box-shadow:none;opacity:1}
#days button .leaf,#days button:disabled .leaf{display:grid;place-items:center;border:0;background:none;color:#4b2e20b8;font:600 clamp(14px,2.08dvh,21px) Georgia;transform:rotate(var(--angle));text-shadow:0 -.55px .45px #3420149e,0 .8px .35px #ffe8ba9c;opacity:1}
#days .leaf:after{display:none}
#days button.opening{background:radial-gradient(ellipse,#fff0b7,#ae763f 52%,#6b4828 72%,transparent 76%)}
#days button.opening .leaf{background:url(bethlehem.svg) var(--crop)/882.7% 2380.9% no-repeat;border-radius:38%}
</style><main><header><b>✦ Adventsatelier</b><small>WINTER 2026</small><select id="world" aria-label="Kalender wählen"></select></header><article><small id="tag"></small><h1 id="title"></h1><p id="intro"></p><div id="frame"><div id="stage"><div id="scene"><canvas id="art" width="800" height="360" aria-label="Illustrierte Winterwelt"></canvas></div><div class="grid" id="days"></div></div></div><button id="back">Zurück zum Kalender</button><div id="panel" tabindex="-1"></div><div id="actions"></div><p id="msg" role="status"></p></article><div class="row"><h2>Dezember</h2><label><input type="checkbox" id="test"> Testmodus</label></div><footer><button id="music">♫ Musik einschalten</button> <span id="saved"></span></footer></main><script>
const worlds=[
null,
['Christel','Das große Weihnachtsabenteuer','POSTAMT FÜR UMWEGE','Ein Nachtzug sammelt Wünsche ein, die jemand jahrelang auf später verschoben hat. Christel übernimmt kurzerhand die Reiseleitung.','Ein Fahrschein für einen Umweg','Auf Christels Küchentisch steht eine winzige Schaffnermütze. Darunter niest jemand. „Ihre Fahrkarte, bitte!“ Christel hebt die Mütze an. Eine Maus hält ihr zwei Billette hin.','Speisewagen wählen','Lokführerin besuchen','Im Speisewagen gewinnt Christel beim Teelöffelpoker einen Messinglöffel.','Die Lokführerin leiht Christel ihre Pfeife. „Einmal pfeifen heißt: Ich entscheide!“','Christel schlägt den Löffel gegen ihr Glas. Als alle zuhören, bestellt sie den ersten Halt direkt vor Sebastians Küche.','Christel pfeift. Der Zug hält vor Sebastians Küche. Emilia starrt aus dem Fenster. „Oma, fährst du den?“'],
null,
null,
null
];
const fixed=1;
const $=id=>document.getElementById(id),world=$('world'),dayGrid=$('days'),ctx=$('art').getContext('2d');let w=fixed??0,step=0,choice=0,playing=false,deadline=0,clock=0,found=[],hints=0,sequence=[],progress={},audio=null,musicTimer;
const now=new Date(),dateKey=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();$('test').checked=new URLSearchParams(location.search).has('test');
function save(){try{localStorage.setItem('advent26-v1-'+w,JSON.stringify(progress));$('saved').textContent='Lokal gespeichert'}catch{$('saved').textContent='Speicherung hier nicht verfügbar'}}
function act(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('actions').append(b);return b}
function clear(){clearInterval(clock);playing=false;$('panel').replaceChildren();$('actions').replaceChildren();$('msg').textContent='';document.querySelectorAll('#scene button').forEach(b=>b.remove())}
function panel(title,body){let h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=body;$('panel').append(h,p)}

let opening=false, lastDoor=1;
async function openDoor(number=1){
  if(opening||document.body.classList.contains('inside'))return;
  const door=dayGrid.children[number-1];
  if(!door||door.disabled)return;
  lastDoor=number;
  opening=true;
  door.classList.add('opening');
  const stage=$('stage'), leaf=door.querySelector('.leaf');
  const view=stage.getBoundingClientRect(), slot=door.getBoundingClientRect();
  const x=slot.left-view.left+slot.width/2, y=slot.top-view.top+slot.height/2;
  const frame=$('frame').getBoundingClientRect();
  const animations=[];
  try{
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches && leaf.animate){
      stage.style.transformOrigin=x+'px '+y+'px';
      animations.push(leaf.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(-109deg)'}],
        {duration:1000,easing:'ease-in-out',fill:'forwards'}));
      await animations[0].finished;
      animations.push(stage.animate([{transform:'none',opacity:1,offset:0},{transform:'translate('+(frame.left+frame.width/2-slot.left-slot.width/2)+'px,'+(frame.top+frame.height/2-slot.top-slot.height/2)+'px) scale('+Math.max(frame.width/slot.width,frame.height/slot.height)+')',opacity:.15}],
        {duration:2000,easing:'ease-in-out',fill:'forwards'}));
      await Promise.all(animations.map(a=>a.finished));
    }
  }finally{
    animations.forEach(a=>a.cancel());
    opening=false;
    door.classList.remove('opening');
  }
  document.body.classList.add('inside');
  if(number===1) start(); else {clear();panel(number+'. Dezember','');}
  window.scrollTo(0,0);
  $('panel').focus({preventScroll:true});
}
async function returnToCalendar(){
  if(opening)return;
  opening=true;
  try{
    home();
    const stage=$('stage'),door=dayGrid.children[lastDoor-1];
    const view=stage.getBoundingClientRect(),slot=door.getBoundingClientRect(),frame=$('frame').getBoundingClientRect();
    const x=slot.left-view.left+slot.width/2,y=slot.top-view.top+slot.height/2;
    stage.style.transformOrigin=x+'px '+y+'px';
    const zoom='translate('+(frame.left+frame.width/2-slot.left-slot.width/2)+'px,'+(frame.top+frame.height/2-slot.top-slot.height/2)+'px) scale('+Math.max(frame.width/slot.width,frame.height/slot.height)+')';
    if(stage.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      await stage.animate([{transform:zoom,opacity:.15},{transform:'none',opacity:1}],{duration:2000,easing:'ease-in-out'}).finished;
    }
    door.focus({preventScroll:true});
  }finally{opening=false}
}
$('back').onclick=returnToCalendar;

const stones=[[408,1438,-6],[802,1320,-10],[124,746,3],[357,1317,-6],[646,1507,4],[174,1378,-8],[537,1278,-5],[122,545,4],[569,1346,4],[470,1182,-3],[716,1251,-7],[443,1562,-4],[123,645,4],[681,1439,5],[248,1194,5],[768,1559,-7],[396,1244,-3],[123,447,-2],[171,1534,-8],[825,1407,7],[477,608,8],[586,1208,-2],[148,1466,5],[122,374,-2]];
function grid(){
  dayGrid.replaceChildren();
  stones.forEach(([x,y,angle],index)=>{
    const day=index+1,button=document.createElement('button'),leaf=document.createElement('span');
    button.disabled=!$('test').checked && new Date()<new Date(2026,11,day);
    button.setAttribute('aria-label','Türchen '+day);
    button.style.cssText='left:'+x/971*100+'%;top:'+y/1619*100+'%;--angle:'+angle+'deg;--crop:'+(x-55)/861*100+'% '+(y-34)/1551*100+'%';
    leaf.className='leaf';
    leaf.textContent=day;
    button.append(leaf);
    button.onclick=()=>openDoor(day);
    dayGrid.append(button);
  });
}
function home(){document.body.classList.remove('inside');clear();let d=worlds[w];$('tag').textContent=d[2];$('title').textContent=d[1];$('intro').textContent=d[3];try{progress=JSON.parse(localStorage.getItem('advent26-v1-'+w))||{}}catch{progress={}}$('saved').textContent=progress.done?'1 von 24 geöffnet':'';grid();if($('test').checked||dateKey>=20261201)act(progress.done?'Erstes Türchen erneut spielen':'Erstes Türchen öffnen',()=>openDoor(1))}
function start(){clear();let d=worlds[w];panel(d[4],d[5]);if(w===4)act('Suche starten · 60 Sekunden',hunt);else for(let i=0;i<2;i++)act(d[6+i],()=>{choice=i;clear();panel(d[4],d[8+i]);if(w===3)code();else act(['Zum Spielertunnel','Den ersten Halt ausrufen','Zum Dorfbrunnen'][w],()=>finish(d[10+i]))});$('panel').scrollIntoView({block:'center'})}
function finish(s){clear();progress={done:true,choice,ending:s};save();panel('Erste Seite im Winteralbum',s);grid();act('Zur Kalenderwelt',returnToCalendar)}
function code(){let keys=choice?['Mitte','Links','Rechts']:['Rechts','Mitte','Links'];sequence=[];$('msg').textContent='Funkfolge merken: '+keys.join(' → ');act('Funkfolge eingeben',()=>{$('actions').replaceChildren();$('msg').textContent='Tippe die drei Sektoren in der richtigen Reihenfolge.';for(let k of ['Links','Mitte','Rechts'])act(k,()=>{if(k!==keys[sequence.length]){sequence=[];$('msg').textContent='Funkstörung. Noch einmal: '+keys.join(' → ');return}sequence.push(k);$('msg').textContent=sequence.join(' → ');if(sequence.length===3)finish(worlds[w][10+choice])})})}
const objects=[['Schlüssel','🗝️',73,54],['Brief','✉️',27,82],['Taschenuhr','⌚',88,86],['Garn','🧶',9,74],['Kerze','🕯️',37,58],['Pinsel','🖌️',54,77],['Feder','🪶',60,28],['Brille','👓',35,28],['Tasse','☕',66,88]];
function hunt(){clear();playing=true;found=[];hints=0;deadline=Date.now()+60000;panel('Das verlassene Atelier','Finde Schlüssel, Brief und Taschenuhr im Bild.');function tick(){let left=Math.ceil((deadline-Date.now())/1000);if(left<=0){clear();panel('Die Atelieruhr schlägt','Du kannst die Suche noch einmal beginnen.');act('Erneut suchen',hunt);return false}$('msg').textContent=left+' s · '+found.length+'/3 gefunden · '+hints+' Hinweise';return true}objects.forEach(([name,icon,x,y],i)=>{let b=document.createElement('button');b.textContent=icon;b.setAttribute('aria-label',name);b.style.left=x+'%';b.style.top=y+'%';b.dataset.obj=i;$('scene').append(b);b.onclick=()=>{if(!playing||!tick()||i>2||found.includes(i))return;found.push(i);b.hidden=true;if(found.length===3){let points=Math.max(0,300+Math.ceil((deadline-Date.now())/1000)*5-hints*50);finish('Unter dem Brief liegt eine Eintrittskarte für zwei. Deine erste Albumseite ist komplett. '+points+' Punkte.')}else tick()}});act('Hinweis · −50 Punkte',()=>{if(!tick())return;let b=[...document.querySelectorAll('#scene button')].slice(0,3).find(b=>!b.hidden);if(!b.classList.contains('hint')){b.classList.add('hint');hints++}tick()});clock=setInterval(tick,250);tick();$('scene').scrollIntoView({block:'center'})}
worlds.forEach((d,i)=>{if(d&&(fixed===null||i===fixed))world.add(new Option(d[0],i))});world.onchange=()=>{w=Number(world.value);home()};$('test').onchange=home;
$('music').onclick=async()=>{if(audio){clearInterval(musicTimer);await audio.close();audio=null;$('music').textContent='♫ Musik einschalten';return}audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();let n=0;function note(){let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=[392,494,587,494,440,523,659,523][n++%8];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+.72)}note();musicTimer=setInterval(note,750);$('music').textContent='♫ Musik ausschalten'};home();
</script></html>
